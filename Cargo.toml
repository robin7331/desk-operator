[package]
name = "desk-operator"
version = "0.1.0"
edition = "2024"
description = "A unified interface for the equipment on an electronics bench"
rust-version = "1.89"

[[bin]]
name = "desk"
path = "src/main.rs"

[dependencies]
async-trait = "0.1.92"
clap = { version = "4.6.7", features = ["derive", "env"] }
directories = "6.0.0"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
humantime = "2.4.0"
indexmap = { version = "2.14.2", features = ["serde"] }
mlua = { version = "0.12.2", features = ["lua54", "vendored", "async", "serialize", "send"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt", "macros", "time", "sync"] }
toml = { version = "1.2.0", features = ["preserve_order"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
wiremock = "0.6.5"
