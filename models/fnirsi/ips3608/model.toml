#:schema ../../../schemas/model.schema.json
# Model: true for every FNIRSI IPS3608, nothing about any particular bench.

[model]
id       = "fnirsi/ips3608"
name     = "FNIRSI IPS3608"
requires = "desk-operator >= 0.1"
status   = "tested"
tested   = ["hardware V1.1 / firmware V1.2 (Nov 2026)"]
sources  = [
  "https://github.com/brandonjank/ips3608-control",
  "https://github.com/mmgalushka/dps150",
  "https://github.com/Puyodead1/fnirsi-psu",
  "https://github.com/cho45/fnirsi-dps-150",
  "https://github.com/hamsternz/fnirsi_psu",
  "https://www.fnirsi.com/products/ips3608",
]

[source]
script  = "../shared/dps150_protocol.lua"
# 2e3c:5740 is Artery's generic AT32 virtual COM port id, shared by other gadgets: the driver
# checks the model name before sending anything, and users should bind by serial_number.
port    = { usb_vid = 0x2e3c, usb_pid = 0x5740 }
ratings = { max_voltage = 36.0, max_current = 8.0, max_power = 285.0 }   # vendor ratings

[source.params]
name        = "IPS3608"
settle_ms   = 1000   # the output ramps up for several hundred ms after switching on
input_query = true   # status offset 0 is a constant 48.0 on the IPS3608; query 0xC0 measures
# Byte offsets in the full status (query 0xFF), checked on hardware (see ../README.md).
status = { voltage_set = 4, current_set = 8, voltage = 12, current = 16, power = 20, temperature = 24, charge = 99, energy = 103, output = 107, protection = 108, mode = 109 }
