#:schema ../../../schemas/model.schema.json
# Model: true for every Sipeed SLogic32U3, nothing about any particular bench.

[model]
id       = "sipeed/slogic32u3"
name     = "Sipeed SLogic32U3"
requires = "desk-operator >= 0.4"
status   = "community"
sources  = [
  "https://github.com/sipeed/SLogic",
  "https://wiki.sipeed.com/hardware/en/logic_analyzer/slogic32u3/Hardware_Specification.html",
  "https://wiki.sipeed.com/hardware/en/logic_analyzer/slogic32u3/Software_User_Guide.html",
]

[capture]
script = "../shared/slogic.lua"
# Stock sigrok has no driver for it: Sipeed's own sigrok-cli build does (see ../README.md).
sigrok = { driver = "sipeed-slogic-analyzer", build = "https://github.com/sipeed/SLogic/releases" }

# From Sipeed's driver (slogic/slogic32u3.c): its rates, and the highest one per channel mode on a
# 10 Gbps USB link.
[capture.params]
samplerates    = [5e6, 8e6, 10e6, 16e6, 20e6, 25e6, 32e6, 40e6, 50e6, 80e6, 100e6, 160e6, 200e6, 400e6, 800e6, 1400e6]
max_samplerate = { 4 = 1400e6, 8 = 800e6, 16 = 400e6, 32 = 200e6 }

[capture.actions.capture]
switches = false
produces = "file"
doc      = "capture a bounded window of the logic inputs"

[capture.actions.capture.args]
duration   = { type = "number", unit = "s", min = 0.001, doc = "how long to capture, in whole milliseconds" }
samplerate = { type = "number", unit = "Hz", min = 5e6, max = 1400e6, default = 10e6, doc = "5, 8, 10, 16, 20, 25, 32, 40, 50, 80, 100, 160 or 200 MHz; 400 MHz up to 16 channels, 800 MHz up to 8, 1400 MHz with 4" }
channels   = { type = "choice", choices = ["4", "8", "16", "32"], default = "32", doc = "how many channels, counted from D0: 8 is D0 to D7" }
threshold  = { type = "number", unit = "V", min = 0, max = 6, default = 1.7, doc = "switching point of all inputs, in 0.1 V steps; about half the logic level" }
pattern    = { type = "choice", choices = ["normal", "emulation"], default = "normal", doc = "normal: the inputs. emulation: a test pattern from the analyzer itself, no signal needed" }
format     = { type = "choice", choices = ["srzip", "binary", "csv", "vcd"], default = "srzip", doc = "srzip opens in PulseView and SLogicView. csv is slow and large" }
trigger    = { type = "string", optional = true, doc = "sigrok triggers on captured channels, e.g. D0=r or D0=f,D1=1 (0, 1, r, f, e)" }

[capture.streams.samples]
content = "logic"
doc     = "the logic inputs, live, until stopped: all channels of the mode, D0 in bit 0"

[capture.streams.samples.args]
samplerate = { type = "number", unit = "Hz", min = 5e6, max = 1400e6, default = 10e6, doc = "5, 8, 10, 16, 20, 25, 32, 40, 50, 80, 100, 160 or 200 MHz; 400 MHz up to 16 channels, 800 MHz up to 8, 1400 MHz with 4" }
channels   = { type = "choice", choices = ["4", "8", "16", "32"], default = "32", doc = "how many channels, counted from D0: 8 is D0 to D7, one byte per sample" }
threshold  = { type = "number", unit = "V", min = 0, max = 6, default = 1.7, doc = "switching point of all inputs, in 0.1 V steps; about half the logic level" }
pattern    = { type = "choice", choices = ["normal", "emulation"], default = "normal", doc = "normal: the inputs. emulation: a test pattern from the analyzer itself, no signal needed" }
