# Example bench, runnable without hardware:
#
#   cargo run -- --config examples/desk.toml status
#   cargo run -- --config examples/desk.toml power on psu iron
#   cargo run -- --config examples/desk.toml set psu voltage 5v current 1a output on
#   cargo run -- --config examples/desk.toml set iron setpoint 330c
#   cargo run -- --config examples/desk.toml watch psu --count 5
#
# The `mock` provider simulates outlets and keeps their state in a JSON file
# ($DESK_MOCK_STATE, or mock-state.json in your platform state dir).
# Swap `provider = "sim"` for a real provider, e.g. Home Assistant:
#
#   [providers.ha]
#   kind       = "home-assistant"
#   url        = "http://homeassistant.local:8123"
#   token_env  = "HA_TOKEN"     # default; or: token_file = "ha.token" (relative to this file, or ~/...)
#
#   then find your outlets with:  desk provider endpoints ha --search outlet
#   and bind:                     power = { provider = "ha", entity = "switch.desk_outlet_1" }

[providers.sim]
kind = "mock"
endpoints = ["outlet1", "outlet2", "outlet3", "outlet4"]   # what `desk provider endpoints sim` lists
# latency = "150ms"        # make the simulation feel like a network round-trip

[devices.psu]
name    = "FNIRSI IPS3608"
aliases = ["supply", "power supply"]
power   = { provider = "sim", endpoint = "outlet1" }                      # mains, via an outlet
source  = { provider = "sim", endpoint = "psu", max_voltage = 36, max_current = 8, load_ohms = 10 }  # the instrument
limits  = { source = { voltage = 15, current = 2 } }                                    # bench safety, enforced by desk

[devices.load]
name    = "DC load"
aliases = ["dc load"]
power   = { provider = "sim", endpoint = "outlet2" }

[devices.dmm]
name    = "Multimeter"
aliases = ["meter", "multimeter"]
power   = { provider = "sim", endpoint = "outlet3" }

[devices.iron]
name    = "Soldering iron"
aliases = ["soldering iron"]
power   = { provider = "sim", endpoint = "outlet4", timeout = "5s" }
limits  = { heater = { setpoint = 380 } }

# A declared capability: anything that isn't mains or a power supply says what it can do. Usually
# that comes from a device definition (`model = "vendor/model"`); here it's simulated inline (the
# simulated tip temperature simply follows the setpoint).
[devices.iron.heater]
provider = "sim"
endpoint = "iron"
follow   = { temperature = "setpoint" }
values   = { temperature = { type = "number", unit = "°C", doc = "tip temperature" } }
settings = { setpoint = { type = "number", unit = "°C", min = 50, max = 450, doc = "target temperature" } }
actions  = { standby = { switches = true, doc = "heater to standby temperature" } }

# A device without a power path is fine: it simply has no power_switch capability (yet).
[devices.scope]
name = "Oscilloscope"

# Script power paths (Lua): see docs/scripting.md and examples/scripts/.
[devices.station]
name    = "Iron + fume extractor"
aliases = ["solder station"]
power   = { script = "scripts/iron_with_extractor.lua", params = { iron = { provider = "sim", endpoint = "station_iron" }, extractor = { provider = "sim", endpoint = "station_fan" } } }

[devices.lamp]
name    = "Bench lamp (RF remote)"
aliases = ["bench lamp"]
power = { script = "scripts/double_press.lua", params = { remote = { provider = "sim", endpoint = "blind_lamp" } } }
