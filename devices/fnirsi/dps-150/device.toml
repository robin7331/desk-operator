#:schema ../../../schemas/device-definition.schema.json
# Device definition: true for every FNIRSI DPS-150, nothing about any particular bench.

[device]
id       = "fnirsi/dps-150"
name     = "FNIRSI DPS-150"
requires = "desk-operator >= 0.1"
status   = "community" # from documentation; not yet tested on hardware
sources  = ["https://philipp-iot.github.io/fnirsi_protocol/protocol/reference"]

[source]
script  = "../shared/dps150_protocol.lua"
# port: USB id not verified on hardware yet (`desk port list` output welcome)
ratings = { max_voltage = 30.0, max_current = 5.1, max_power = 150.0 }
