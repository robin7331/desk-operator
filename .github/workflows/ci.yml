name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install libudev
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev
      - run: cargo clippy --locked --all-targets -- -D warnings
      # Show test failures too when clippy fails, and every test file's.
      - run: cargo test --locked --no-fail-fast
        if: ${{ !cancelled() }}

  msrv:
    name: Minimum Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The same version as `rust-version` in Cargo.toml (and the README badge).
      - name: Cargo.toml still says 1.89
        run: grep -q '^rust-version = "1.89"$' Cargo.toml
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.89"
      - uses: Swatinem/rust-cache@v2
      - name: Install libudev
        run: sudo apt-get update && sudo apt-get install -y libudev-dev
      - run: cargo check --locked --all-targets

  lint:
    name: Format and installers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.3
      - name: Every dependency's license is accepted (about.toml)
        run: cargo about generate --locked about.hbs -o /dev/null
      - run: shellcheck install.sh
      - name: Parse install.ps1
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors; exit 1 }
